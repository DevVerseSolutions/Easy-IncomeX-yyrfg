<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>All History - Easy IncomeX</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-teal: #0ba381;
      --primary-gradient: linear-gradient(135deg, #0ba381 0%, #057a60 100%);
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: calc(85px + var(--safe-bottom));
    }

    /* Top Header */
    .top-header {
      background: #ffffff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      background: none;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      cursor: pointer;
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
    }

    .container {
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Summary Stats Grid */
    .stats-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
    }

    .stat-box {
      padding: 8px 4px;
      border-radius: 14px;
      background: #f8fafc;
    }

    .stat-num {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-pending .stat-num { color: #d97706; }
    .stat-approved .stat-num { color: #059669; }
    .stat-rejected .stat-num { color: #dc2626; }

    /* Filter Tabs */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      padding: 8px 16px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: var(--primary-teal);
      color: #ffffff;
      border-color: var(--primary-teal);
      box-shadow: 0 4px 12px rgba(11, 163, 129, 0.2);
    }

    /* History Cards */
    .history-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #f1f5f9;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .service-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .service-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }

    .service-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      text-transform: capitalize;
    }

    .pill-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pill-pending { background: #fef3c7; color: #d97706; }
    .pill-approved { background: #dcfce7; color: #15803d; }
    .pill-rejected { background: #fee2e2; color: #b91c1c; }

    .card-info {
      background: #f8fafc;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      gap: 4px;
      word-break: break-all;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
    }
    .empty-state svg {
      stroke: var(--text-muted);
      margin-bottom: 12px;
      opacity: 0.6;
    }
    .empty-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .empty-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      height: 68px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-bottom: var(--safe-bottom);
      z-index: 900;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      width: 18%;
    }

    .nav-item svg {
      stroke: #94a3b8;
    }

    .nav-home-btn {
      position: relative;
      top: -16px;
      background: var(--primary-gradient);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff !important;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 18px rgba(11, 163, 129, 0.4);
      gap: 1px;
    }

    .nav-home-btn svg {
      stroke: none;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <a href="index.html" class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Back
    </a>
    <div class="header-title">All History</div>
    <div style="width: 48px;"></div>
  </header>

  <div class="container">
    <!-- Summary Counter Card -->
    <div class="stats-card">
      <div class="stat-box stat-pending">
        <div class="stat-num" id="pendingCount">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-box stat-approved">
        <div class="stat-num" id="approvedCount">0</div>
        <div class="stat-label">Approved</div>
      </div>
      <div class="stat-box stat-rejected">
        <div class="stat-num" id="rejectedCount">0</div>
        <div class="stat-label">Rejected</div>
      </div>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="approved">Approved</button>
      <button class="filter-btn" data-filter="rejected">Rejected</button>
    </div>

    <!-- History List -->
    <div id="historyContainer">
      <p style="font-size: 13px; color: var(--text-muted); text-align: center; padding: 24px 0;">Loading all records...</p>
    </div>
  </div>

  <!-- Bottom Navigation matching Home Page Exactly -->
  <nav class="bottom-nav">
    <a href="help.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <span>Help</span>
    </a>

    <a href="wallet.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
        <line x1="2" y1="10" x2="22" y2="10"></line>
      </svg>
      <span>Wallet</span>
    </a>

    <a href="index.html" class="nav-item nav-home-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span style="font-size: 9px; font-weight: 800; letter-spacing: 0.5px;">HOME</span>
    </a>

    <a href="team.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span>Team</span>
    </a>

    <a href="profile.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Profile</span>
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFJsftmikEsXNIGuvftREk-v0pP2kSAeM",
      authDomain: "easy-incomex.firebaseapp.com",
      projectId: "easy-incomex",
      storageBucket: "easy-incomex.firebasestorage.app",
      messagingSenderId: "783518185444",
      appId: "1:783518185444:web:68dde7c163ff83d94279f1",
      measurementId: "G-V63PKF0Q9N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();
    const currentUserId = tg?.initDataUnsafe?.user?.id?.toString() || "demo_tg_user";

    let allRecords = [];
    let currentFilter = "all";

    // Service Icons & Theme Styling Mapping
    const serviceStyles = {
      gmail: { bg: "#ea4335", label: "Gmail Sell" },
      facebook: { bg: "#1877f2", label: "Facebook Sell" },
      tiktok: { bg: "#010101", label: "TikTok Sell" },
      instagram: { bg: "#e1306c", label: "Instagram Sell" },
      twitter: { bg: "#0f172a", label: "Twitter (X) Sell" },
      telegram: { bg: "#229ed9", label: "Telegram Sell" },
      linkedin: { bg: "#0a66c2", label: "LinkedIn Sell" }
    };

    // Filter Buttons Listener
    const filterBtns = document.querySelectorAll(".filter-btn");
    filterBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        filterBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        renderList();
      });
    });

    // Real-time listener for all user submissions
    const q = query(
      collection(db, "serviceRequests"),
      where("userId", "==", currentUserId)
    );

    onSnapshot(q, (snapshot) => {
      allRecords = [];
      let pending = 0, approved = 0, rejected = 0;

      snapshot.forEach(doc => {
        const data = doc.data();
        allRecords.push({ id: doc.id, ...data });

        const st = (data.status || "pending").toLowerCase();
        if (st === "approved") approved++;
        else if (st === "rejected") rejected++;
        else pending++;
      });

      // Sort by newest first
      allRecords.sort((a, b) => {
        const timeA = a.createdAt?.seconds || 0;
        const timeB = b.createdAt?.seconds || 0;
        return timeB - timeA;
      });

      // Update Top Counters
      document.getElementById("pendingCount").textContent = pending;
      document.getElementById("approvedCount").textContent = approved;
      document.getElementById("rejectedCount").textContent = rejected;

      renderList();
    });

    // Render Filtered List
    function renderList() {
      const container = document.getElementById("historyContainer");
      const filtered = allRecords.filter(item => {
        const status = (item.status || "pending").toLowerCase();
        if (currentFilter === "all") return true;
        return status === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <div class="empty-title">No records found</div>
            <div class="empty-sub">There is no history under this filter category.</div>
          </div>
        `;
        return;
      }

      container.innerHTML = "";
      filtered.forEach(item => {
        const sType = (item.serviceType || "service").toLowerCase();
        const conf = serviceStyles[sType] || { bg: "#0ba381", label: item.serviceType || "Account Sell" };
        const status = (item.status || "pending").toLowerCase();
        
        // Find main identifier submitted
        const identifier = item.instagramUsername || item.tiktokUsername || item.twitterUsername || 
                           item.telegramUsername || item.gmailAddress || item.profileLink || item.linkedinUsername || "Account Details";

        const emailPhone = item.associatedEmail || item.phoneNumber || item.loginIdentifier || item.recoveryEmail || "";
        const dateStr = item.createdAt ? new Date(item.createdAt.seconds * 1000).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : "Just now";

        const card = document.createElement("div");
        card.className = "history-card";
        card.innerHTML = `
          <div class="card-top">
            <div class="service-badge">
              <div class="service-icon" style="background: ${conf.bg};">
                ${conf.label.charAt(0)}
              </div>
              <div>
                <div class="service-name">${conf.label}</div>
              </div>
            </div>
            <span class="pill-badge pill-${status}">${status}</span>
          </div>

          <div class="card-info">
            <div><strong>Target:</strong> ${identifier}</div>
            ${emailPhone ? `<div><strong>Associated Contact:</strong> ${emailPhone}</div>` : ""}
            ${item.twoFactorAuth ? `<div><strong>2FA Key / Backup:</strong> ${item.twoFactorAuth}</div>` : ""}
            ${item.notes ? `<div><strong>Note:</strong> ${item.notes}</div>` : ""}
          </div>

          <div class="card-footer">
            <span>Req ID: #${item.id.substring(0, 6)}</span>
            <span>${dateStr}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
