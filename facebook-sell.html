<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Facebook Sell - NexoraX</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-teal: #0ba381;
      --primary-gradient: linear-gradient(135deg, #0ba381 0%, #057a60 100%);
      --fb-blue: #1877f2;
      --fb-gradient: linear-gradient(135deg, #1877f2 0%, #0d65d9 100%);
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: calc(85px + var(--safe-bottom));
    }

    .top-header {
      background: #ffffff;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      background: none;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      cursor: pointer;
    }

    .header-title {
      font-size: 16px;
      font-weight: 800;
    }

    .container {
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    .service-hero-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px 18px 18px 18px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      margin-bottom: 16px;
    }

    .fb-icon-container {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: var(--fb-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
      box-shadow: 0 8px 18px rgba(24, 119, 242, 0.28);
    }

    .service-headline {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .service-subtext {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .rate-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 800;
      margin-top: 14px;
    }

    /* Admin Assigned Credential/Reference Box */
    .admin-reference-box {
      margin-top: 16px;
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 16px;
      padding: 14px;
      text-align: left;
    }

    .ref-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .ref-value-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .ref-text {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.5px;
    }

    .btn-copy {
      background: var(--primary-teal);
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .content-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
    }

    .card-heading {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      background: #f8fafc;
      color: var(--text-main);
      outline: none;
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--primary-teal);
      background: #ffffff;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary-teal);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(11, 163, 129, 0.25);
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-title {
      font-size: 13px;
      font-weight: 700;
    }

    .history-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .pill-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .pill-pending { background: #fef3c7; color: #d97706; }
    .pill-approved { background: #dcfce7; color: #15803d; }
    .pill-rejected { background: #fee2e2; color: #b91c1c; }

    /* Bottom Navigation Styles */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      height: 68px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-bottom: var(--safe-bottom);
      z-index: 900;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      text-decoration: none;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      width: 18%;
    }

    .nav-item svg {
      stroke: #94a3b8;
    }

    .nav-home-btn {
      position: relative;
      top: -16px;
      background: var(--primary-gradient);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff !important;
      border: 3px solid #ffffff;
      box-shadow: 0 8px 18px rgba(11, 163, 129, 0.4);
      gap: 1px;
    }

    .nav-home-btn svg {
      stroke: none;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <a href="index.html" class="back-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Back
    </a>
    <div class="header-title">Facebook Sell</div>
    <div style="width: 48px;"></div>
  </header>

  <div class="container">
    <div class="service-hero-card">
      <div class="fb-icon-container">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#ffffff">
          <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
        </svg>
      </div>
      <h1 class="service-headline">Sell Facebook Accounts</h1>
      <p class="service-subtext">Submit active profiles or aged Facebook accounts for valuation.</p>
      <div class="rate-pill" id="rateDisplay">Price: ৳ 0.00 / Verified Unit</div>

      <!-- Admin Assigned Reference Box -->
      <div class="admin-reference-box">
        <div class="ref-header">
          <span>Admin Assigned Reference Code</span>
          <span>Task Preset</span>
        </div>
        <div class="ref-value-row">
          <span class="ref-text" id="adminAssignedCode">Loading...</span>
          <button class="btn-copy" id="copyCodeBtn">Copy</button>
        </div>
      </div>
    </div>

    <!-- Submission Form -->
    <div class="content-card">
      <div class="card-heading">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary-teal)" stroke-width="2.2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        Submit Facebook Account
      </div>
      <form id="submissionForm">
        <div class="form-group">
          <label class="form-label" for="fbProfileLink">Profile Link / UID</label>
          <input type="text" id="fbProfileLink" class="form-input" placeholder="e.g. facebook.com/profile.php?id=... or profile link" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="twoFactorAuth">Two-factor authentication (2FA Code / Key)</label>
          <input type="text" id="twoFactorAuth" class="form-input" placeholder="Enter 2FA backup codes or 2FA secret key" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="accountPassword">Account Password</label>
          <input type="text" id="accountPassword" class="form-input" placeholder="Enter Facebook password" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="submissionDetails">Additional Instructions / Account Notes</label>
          <textarea id="submissionDetails" class="form-textarea" rows="3" placeholder="Enter account creation year, friends count, 2FA status, or notes..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Submit for Review</button>
      </form>
    </div>

    <!-- History Section -->
    <div class="content-card">
      <div class="card-heading">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary-teal)" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        Recent Submissions
      </div>
      <div id="historyList">
        <p style="font-size: 13px; color: var(--text-muted); text-align: center; padding: 12px 0;">Loading history...</p>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="help.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
      <span>Help</span>
    </a>

    <a href="wallet.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="5" width="20" height="14" rx="2"></rect>
        <line x1="2" y1="10" x2="22" y2="10"></line>
      </svg>
      <span>Wallet</span>
    </a>

    <a href="index.html" class="nav-item nav-home-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span style="font-size: 9px; font-weight: 800; letter-spacing: 0.5px;">HOME</span>
    </a>

    <a href="team.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
      <span>Team</span>
    </a>

    <a href="profile.html" class="nav-item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span>Profile</span>
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, collection, query, where, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDFJsftmikEsXNIGuvftREk-v0pP2kSAeM",
      authDomain: "easy-incomex.firebaseapp.com",
      projectId: "easy-incomex",
      storageBucket: "easy-incomex.firebasestorage.app",
      messagingSenderId: "783518185444",
      appId: "1:783518185444:web:68dde7c163ff83d94279f1",
      measurementId: "G-V63PKF0Q9N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const tg = window.Telegram?.WebApp;
    if (tg) tg.ready();
    const currentUserId = tg?.initDataUnsafe?.user?.id?.toString() || "demo_tg_user";

    // Load Price and Admin-Provided Password/Reference Code
    onSnapshot(doc(db, "settings", "services"), (docSnap) => {
      if (docSnap.exists()) {
        const info = (docSnap.data() && docSnap.data().facebook) || {};
        const rateVal = info.rate !== undefined ? info.rate : (info.rewardAmount !== undefined ? info.rewardAmount : null);
        if (rateVal !== null && rateVal !== "") {
          document.getElementById("rateDisplay").textContent = `Price: ৳ ${Number(rateVal).toFixed(2)} / Verified Unit`;
        }
        const passVal = (info.defaultPassword !== undefined && info.defaultPassword !== "") ? info.defaultPassword : (info.adminPresetCode || "FACEBOOK_TASK_CODE_2026");
        document.getElementById("adminAssignedCode").textContent = passVal;
      }
    });

    // Reliable copy helper that works in WebViews, Telegram WebApp, and all browsers
    function copyTextToClipboard(text) {
      if (!text || text === "Loading...") return;

      const onCopySuccess = () => {
        const btn = document.getElementById("copyCodeBtn");
        const originalText = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => {
          btn.textContent = originalText;
        }, 1500);
        alert("Code copied to clipboard!");
      };

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(onCopySuccess).catch(() => {
          fallbackCopyText(text, onCopySuccess);
        });
      } else {
        fallbackCopyText(text, onCopySuccess);
      }
    }

    function fallbackCopyText(text, callback) {
      try {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-999999px";
        textArea.style.top = "-999999px";
        textArea.setAttribute("readonly", "");
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        const successful = document.execCommand("copy");
        document.body.removeChild(textArea);
        if (successful && callback) {
          callback();
        } else if (!successful) {
          prompt("Copy manually:", text);
        }
      } catch (err) {
        prompt("Copy manually:", text);
      }
    }

    document.getElementById("copyCodeBtn").addEventListener("click", () => {
      const code = document.getElementById("adminAssignedCode").textContent.trim();
      copyTextToClipboard(code);
    });

    const q = query(
      collection(db, "serviceRequests"),
      where("userId", "==", currentUserId),
      where("serviceType", "==", "facebook")
    );

    onSnapshot(q, (snapshot) => {
      const container = document.getElementById("historyList");
      if (snapshot.empty) {
        container.innerHTML = `<p style="font-size: 13px; color: var(--text-muted); text-align: center; padding: 12px 0;">No past Facebook submissions.</p>`;
        return;
      }

      container.innerHTML = "";
      snapshot.forEach((d) => {
        const item = d.data();
        const dateStr = item.createdAt ? new Date(item.createdAt.seconds * 1000).toLocaleDateString() : "Just now";
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <div>
            <div class="history-title">${item.profileLink || "Facebook Account"}</div>
            <div class="history-meta">${item.loginIdentifier ? item.loginIdentifier + ' • ' : ''}${dateStr}</div>
          </div>
          <span class="pill-badge pill-${item.status}">${item.status}</span>
        `;
        container.appendChild(div);
      });
    });

    document.getElementById("submissionForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const profileLink = document.getElementById("fbProfileLink").value.trim();
      const twoFactorAuth = document.getElementById("twoFactorAuth").value.trim();
      const accountPassword = document.getElementById("accountPassword").value.trim();
      const notes = document.getElementById("submissionDetails").value.trim();

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Submitting...";

      try {
        await addDoc(collection(db, "serviceRequests"), {
          userId: currentUserId,
          serviceType: "facebook",
          profileLink: profileLink,
          twoFactorAuth: twoFactorAuth,
          password: accountPassword,
          notes: notes,
          status: "pending",
          createdAt: serverTimestamp()
        });

        alert("Submission successful! Review status in the history below.");
        e.target.reset();
      } catch (err) {
        console.error("Submission failed:", err);
        alert("Failed to submit request.");
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit for Review";
      }
    });
  </script>
</body>
</html>
